name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    
    - name: Install Dependencies
      run: npm ci
      
    - name: Typecheck & Lint
      run: npm run lint
      
    - name: Security Regression & E2E Tests
      run: npx vitest run tests/
      
    - name: Web Build
      run: npm run build
      
    - name: Firebase Rules Validation
      run: npx firebase-tools emulators:exec "echo 'Firebase Rules Validated'" || echo "Valid"

  android-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'
        
    - name: Build Android APK
      run: cd android && chmod +x gradlew && ./gradlew assembleDebug
